# ─────────────────────────────────────────────────────────────────────────────
# Per-Branch CI  –  triggers on every push to feature/* or fix/* branches
#
# Pipeline (Fail-Fast order):
#   1. Lint & Format   (cheapest/fastest – runs first)
#   2. Unit Tests      (with coverage report)
#   3. Build Docker image tagged with the Git SHA  (immutable tag)
#   4. Push to Dev registry  (Google Artifact Registry)
# ─────────────────────────────────────────────────────────────────────────────
name: Feature Branch CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

env:
  # ── Registry settings (set these in repo Settings → Secrets & Variables) ──
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_REGION: us-central1
  GAR_REPO: dev-images
  IMAGE_NAME: ci-cd-demo

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Format  (fastest gate – no Docker needed)
  # ────────────────────────────────────────────────────────────────────────────
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Black (format check)
        run: black --check --diff .

      - name: Run Flake8 (lint)
        run: flake8 .

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Unit Tests  (depends on lint passing)
  # ────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-format   # Fail-Fast: only run if lint passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Pytest with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Dev Image  (only after tests pass)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push-dev:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    needs: unit-tests   # Build Once: only if ALL quality gates pass

    # Only push images from actual branch pushes (not PR events)
    if: github.event_name == 'push'

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
      full-image: ${{ steps.meta.outputs.full-image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Immutable tag: Git SHA (never use "latest" in CI) ──────────────────
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          BRANCH_SLUG="${GITHUB_REF_NAME//\//-}"
          IMAGE_TAG="${BRANCH_SLUG}-${SHORT_SHA}"
          FULL_IMAGE="${GAR_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPO}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "full-image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Built image tag: ${IMAGE_TAG}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${GAR_REGION}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --target runtime \
            --build-arg APP_VERSION=${{ steps.meta.outputs.image-tag }} \
            --tag ${{ steps.meta.outputs.full-image }} \
            .

      - name: Push to Dev registry
        run: docker push ${{ steps.meta.outputs.full-image }}

      - name: Summary
        run: |
          echo "### Dev Image Published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.meta.outputs.full-image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
